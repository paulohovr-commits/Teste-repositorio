<title>Novos Clientes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Funil de prospecção: o quadro é uma mesa de trabalho fria; cada lead é uma ficha clara com os links do cliente à mão. */
:root {
  --bg: #e9edf1; --surface: #ffffff; --col: #dde3ea; --col-head: #d3dae3; --fg: #16202b; --muted: #586776; --faint: #8794a1;
  --line: #cfd7e0; --accent: #d9650a; --accent-2: #f2a03d; --accent-ink: #ffffff; --accent-soft: #fde9d4;
  --good: #1d8550; --good-soft: #d8f3e4; --warn: #9a6a00; --warn-soft: #fff1c7; --crit: #c8352c; --crit-soft: #fde0dd;
  --link-bg: #e5eefb; --link-fg: #1a5bb8; --wa-bg: #d7f5e3; --wa-fg: #13683a; --shadow: 0 1px 2px rgba(22,32,43,.12), 0 0 0 1px rgba(22,32,43,.06);
  --veil: rgba(15,20,26,.55);
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111418; --surface: #242b33; --col: #191e24; --col-head: #1f252c; --fg: #e6eaee; --muted: #9aa6b2; --faint: #6c7884;
  --line: #313a45; --accent: #f08a2c; --accent-2: #f7b45c; --accent-ink: #1b1104; --accent-soft: #3b2814;
  --good: #52c98c; --good-soft: #163a27; --warn: #f0c14e; --warn-soft: #3a3014; --crit: #ff7166; --crit-soft: #44201d;
  --link-bg: #1d2f4b; --link-fg: #9fc4ff; --wa-bg: #153725; --wa-fg: #7fe0a6; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.05);
  --veil: rgba(0,0,0,.65); color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #111418; --surface: #242b33; --col: #191e24; --col-head: #1f252c; --fg: #e6eaee; --muted: #9aa6b2; --faint: #6c7884;
  --line: #313a45; --accent: #f08a2c; --accent-2: #f7b45c; --accent-ink: #1b1104; --accent-soft: #3b2814;
  --good: #52c98c; --good-soft: #163a27; --warn: #f0c14e; --warn-soft: #3a3014; --crit: #ff7166; --crit-soft: #44201d;
  --link-bg: #1d2f4b; --link-fg: #9fc4ff; --wa-bg: #153725; --wa-fg: #7fe0a6; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.05);
  --veil: rgba(0,0,0,.65); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 14px/1.45 var(--body); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--link-fg); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 12px; }

.app { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto 1fr; height: 100%; min-height: 0; }
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 14px 16px 8px; }
.brand h1 { font: 800 24px/1 var(--display); margin: 0; letter-spacing: -.01em; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
.stats { display: flex; flex-wrap: wrap; gap: 6px; }
.stat { display: flex; flex-direction: column; padding: 5px 11px; border-radius: 9px; background: var(--surface); box-shadow: var(--shadow); min-width: 0; border: 0; text-align: left; }
.stat b { font: 600 15px var(--mono); font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--muted); }
.stat.crit b { color: var(--crit); } .stat.warn b { color: var(--warn); } .stat.good b { color: var(--good); }
.top-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }

.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; font-weight: 600; font-size: 13px; white-space: nowrap; text-decoration: none; color: var(--fg); }
.btn:hover { border-color: var(--faint); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: linear-gradient(135deg, var(--accent-2), var(--accent)); border-color: transparent; color: var(--accent-ink); }
.btn.danger { background: var(--crit); border-color: transparent; color: #fff; }
.btn.wa { background: var(--wa-bg); color: var(--wa-fg); border-color: transparent; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.sm { padding: 4px 9px; font-size: 12px; }
.input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 7px 9px; min-width: 0; }
.input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
textarea.input { resize: vertical; }

.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 4px 16px 10px; }
.tabs { display: flex; gap: 2px; background: var(--col); padding: 3px; border-radius: 9px; }
.tabs button { border: 0; background: transparent; padding: 5px 11px; border-radius: 7px; font-weight: 600; font-size: 13px; color: var(--muted); }
.tabs button.on { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.search { width: 230px; max-width: 100%; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 20px; padding: 3px 10px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; color: var(--fg); }
.chip.on { border-color: var(--accent); background: var(--accent-soft); }
.chip i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.clear { border: 0; background: none; color: var(--link-fg); font-size: 12px; }

.notice { margin: 0 16px 10px; padding: 9px 12px; border-radius: 9px; background: var(--accent-soft); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; }
.notice[hidden] { display: none !important; }

main { min-height: 0; overflow: auto; }
.board { display: flex; align-items: flex-start; gap: 12px; padding: 2px 16px 24px; height: 100%; overflow-x: auto; }
.col { flex: 0 0 272px; width: 272px; max-height: 100%; display: flex; flex-direction: column; background: var(--col); border-radius: 12px; }
.col.drop { box-shadow: 0 0 0 2px var(--accent); }
.col-head { display: flex; align-items: center; gap: 7px; padding: 10px 10px 8px 12px; border-radius: 12px 12px 0 0; border-top: 5px solid var(--c, var(--accent)); }
.col-head h2 { font: 700 14px var(--body); margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.count { font: 500 12px var(--mono); color: var(--muted); background: var(--col-head); border-radius: 9px; padding: 0 7px; }
.col-sum { padding: 0 12px 6px; font-size: 11px; color: var(--muted); }
.cards { flex: 1 1 auto; overflow-y: auto; padding: 2px 8px 6px; display: flex; flex-direction: column; gap: 8px; min-height: 12px; }
.col-empty { font-size: 12px; color: var(--muted); text-align: center; padding: 8px 6px 10px; }
.col-foot { padding: 4px 8px 8px; }
.add { width: 100%; text-align: left; border: 0; background: none; padding: 7px 8px; border-radius: 8px; color: var(--muted); font-weight: 600; }
.add:hover { background: var(--col-head); color: var(--fg); }
.composer { display: flex; flex-direction: column; gap: 6px; }

.card { background: var(--surface); border-radius: 10px; padding: 10px 12px; box-shadow: var(--shadow); cursor: pointer; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; flex: 0 0 auto; }
.card:hover { box-shadow: 0 0 0 2px var(--link-fg); }
.card.src { opacity: .35; }
.card .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
.card .tags i { width: 34px; height: 7px; border-radius: 4px; }
.card h3 { margin: 0; font-size: 14px; font-weight: 600; word-break: break-word; }
.card .meta { font-size: 12px; color: var(--muted); margin-top: 1px; }
.links { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; }
.links a { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; background: var(--link-bg); color: var(--link-fg); text-decoration: none; }
.links a.wa { background: var(--wa-bg); color: var(--wa-fg); }
.badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; font-size: 11.5px; }
.badges span { padding: 1px 7px; border-radius: 5px; background: var(--col); color: var(--muted); }
.badges .late { background: var(--crit-soft); color: var(--crit); font-weight: 600; }
.badges .today { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.badges .full { background: var(--good-soft); color: var(--good); }
.ex { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); font-weight: 700; }
.slot { height: 40px; border-radius: 10px; border: 2px dashed var(--faint); flex: 0 0 auto; }
.drag-ghost { position: fixed; left: 0; top: 0; z-index: 90; pointer-events: none; box-shadow: 0 14px 30px rgba(0,0,0,.3); }
body.dragging, body.dragging * { cursor: grabbing !important; user-select: none; }

.page { max-width: 880px; padding: 4px 16px 40px; }
.page h2 { font: 700 18px var(--display); margin: 18px 0 8px; }
.group-title { display: flex; gap: 8px; align-items: baseline; font: 700 15px var(--display); margin: 18px 0 8px; }
.group-title.late { color: var(--crit); } .group-title.today { color: var(--warn); }
.row-item { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; background: var(--surface); border-radius: 10px; padding: 10px 12px; margin-bottom: 6px; box-shadow: var(--shadow); }
.row-main { flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; gap: 2px; border: 0; background: none; text-align: left; padding: 0; }
.row-main b { font-weight: 600; }
.when { font: 500 12px var(--mono); padding: 1px 7px; border-radius: 5px; background: var(--col); color: var(--muted); }
.when.late { background: var(--crit-soft); color: var(--crit); } .when.today { background: var(--warn-soft); color: var(--warn); }
.empty { border: 1px dashed var(--line); border-radius: 12px; padding: 18px; color: var(--muted); max-width: 620px; }
.empty b { color: var(--fg); }

/* ---------- aba Escritórios ---------- */
.off-page { padding: 4px 16px 40px; display: flex; flex-direction: column; gap: 12px; }
.off-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.off-head p { margin: 0; color: var(--muted); font-size: 13px; max-width: 70ch; }
.off-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 430px), 1fr)); gap: 12px; align-items: start; }
.office { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; border-top: 4px solid var(--c, var(--line)); }
.office h3 { margin: 0; font: 700 16px var(--display); text-wrap: balance; }
.office .o-top { display: flex; gap: 8px; align-items: flex-start; justify-content: space-between; }
.office .o-meta { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 1px; }
.stage-chip { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; background: var(--col); color: var(--muted); white-space: nowrap; }
.links3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.lnk { border: 1px solid var(--line); border-radius: 9px; padding: 7px 8px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.lnk b { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.lnk.ok { border-color: transparent; background: var(--good-soft); }
.lnk .val { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lnk .row2 { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
.lnk a.go { font-size: 12px; font-weight: 700; text-decoration: none; }
.lnk .edit { border: 0; background: none; color: var(--muted); font-size: 12px; padding: 0 2px; }
.lnk .input { padding: 4px 6px; font-size: 12px; }
.rating { font-size: 12px; color: var(--warn); font-weight: 600; }
.office details { background: var(--bg); border-radius: 9px; padding: 8px 10px; }
.office summary { cursor: pointer; font-weight: 700; font-size: 13px; }
.office .analysis { white-space: pre-wrap; font-size: 13px; margin-top: 6px; line-height: 1.5; }
.pitch-box { display: flex; flex-direction: column; gap: 6px; }
.pitch-box b { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.pitch-box textarea { font-size: 13px; line-height: 1.5; min-height: 150px; }
.channel { font-size: 12px; color: var(--muted); }
.ai-status { font-size: 12px; color: var(--muted); }
@media (max-width: 760px) { .links3 { grid-template-columns: 1fr; } }

.set-list { display: flex; flex-direction: column; gap: 6px; }
.set-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.set-row .input { flex: 1 1 160px; }
.set-row input[type=color] { width: 36px; height: 32px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); padding: 2px; }

.veil { position: fixed; inset: 0; z-index: 70; background: var(--veil); display: flex; justify-content: center; align-items: flex-start; overflow-y: auto; padding: 32px 12px; }
.modal { position: relative; z-index: 71; background: var(--bg); border-radius: 14px; width: 100%; max-width: 900px; padding: 16px 18px 20px; box-shadow: 0 24px 60px rgba(0,0,0,.4); }
.m-top { display: flex; align-items: center; gap: 10px; justify-content: space-between; margin-bottom: 6px; }
.x { border: 0; background: none; font-size: 20px; color: var(--muted); padding: 2px 8px; border-radius: 6px; }
.x:hover { background: var(--col); }
.m-cols { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 18px; }
.m-left, .m-right { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.m-name { font: 800 22px var(--display); border: 2px solid transparent; background: transparent; width: 100%; padding: 2px 6px; border-radius: 7px; }
.m-name:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.sec { background: var(--surface); border-radius: 11px; padding: 12px; box-shadow: var(--shadow); }
.sec h4 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
.field { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); min-width: 0; }
.field .with { display: flex; gap: 4px; }
.open { display: grid; place-items: center; flex: 0 0 32px; height: 32px; border-radius: 7px; background: var(--link-bg); color: var(--link-fg); text-decoration: none; font-weight: 700; }
.tagpick { display: flex; flex-wrap: wrap; gap: 6px; }
.tagpick button { border: 2px solid transparent; border-radius: 6px; padding: 3px 10px; color: #fff; font-weight: 700; font-size: 12px; opacity: .45; text-shadow: 0 1px 1px rgba(0,0,0,.3); }
.tagpick button.on { opacity: 1; border-color: var(--fg); }
.ck { display: flex; flex-direction: column; gap: 4px; }
.progress { height: 7px; border-radius: 4px; background: var(--col); overflow: hidden; margin-bottom: 4px; }
.progress span { display: block; height: 100%; background: var(--link-fg); }
.progress span.full { background: var(--good); }
.ck label { display: flex; gap: 8px; align-items: center; font-size: 13px; }
.ck label.done span { text-decoration: line-through; color: var(--muted); }
.quick { display: flex; flex-wrap: wrap; gap: 5px; }
.hist { display: flex; flex-direction: column; gap: 6px; max-height: 300px; overflow: auto; }
.hist div { background: var(--bg); border-radius: 8px; padding: 6px 9px; font-size: 13px; }
.hist time { display: block; font: 500 11px var(--mono); color: var(--muted); }
.msg { font-size: 12px; background: var(--bg); border-radius: 8px; padding: 8px; white-space: pre-wrap; }
.confirm { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; }

.imp { max-width: 940px; display: flex; flex-direction: column; gap: 10px; }
.paste { font: 12px/1.5 var(--mono); }
.preview { background: var(--surface); border-radius: 10px; padding: 8px; overflow-x: auto; max-height: 300px; box-shadow: var(--shadow); }
.preview table { border-collapse: collapse; width: 100%; font-size: 12px; }
.preview th, .preview td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.preview tr.dup td { color: var(--faint); text-decoration: line-through; }
.opt { display: flex; gap: 8px; align-items: center; font-size: 13px; }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 95; background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-weight: 600; font-size: 13px; max-width: calc(100% - 32px); }

@media (max-width: 760px) {
  .m-cols, .grid2 { grid-template-columns: 1fr; }
  .veil { padding: 0; }
  .modal { border-radius: 0; min-height: 100%; }
  .top-actions { margin-left: 0; }
  .col { flex-basis: 84vw; width: 84vw; }
  .search { width: 100%; }
  .top { padding-top: 10px; gap: 8px; }
  .brand p { display: none; }
  .stats, .chips { flex-wrap: nowrap; overflow-x: auto; width: 100%; min-width: 0; scrollbar-width: none; }
  .stat, .chip { flex: 0 0 auto; }
  .tabs { max-width: 100%; overflow-x: auto; scrollbar-width: none; }
  .tabs button { flex: 0 0 auto; padding: 5px 9px; }
  .top-actions { width: 100%; }
  .top-actions .btn.primary { flex: 1; justify-content: center; }
  .notice { font-size: 12px; }
}
@media (prefers-reduced-motion: no-preference) { .card, .btn, .chip { transition: box-shadow .12s, border-color .12s, background .12s; } }
</style>

<div class="app">
  <header class="top">
    <div class="brand"><h1>Novos Clientes</h1><p>Seu funil de prospecção</p></div>
    <div class="stats" id="stats"></div>
    <div class="top-actions">
      <button class="btn primary" id="btn-add">＋ Colar / importar leads</button>
      <button class="btn" id="btn-csv" hidden>⬇ Baixar planilha</button>
    </div>
  </header>
  <div class="bar">
    <div class="tabs" id="tabs">
      <button data-v="board" class="on">Quadro</button>
      <button data-v="offices">Escritórios</button>
      <button data-v="agenda">Agenda</button>
      <button data-v="archive">Arquivados</button>
      <button data-v="settings">Ajustes</button>
    </div>
    <input class="input search" id="q" placeholder="Buscar nome, cidade, nicho, @instagram…" autocomplete="off">
    <div class="chips" id="filters"></div>
  </div>
  <div class="notice" id="notice" hidden></div>
  <main id="view"></main>
</div>
<div id="modal"></div>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
// ================= padrões =================
const DEFAULT_CFG = {
  stages: [
    { id: "novo", name: "Leads novos", color: "#3b82f6" },
    { id: "pesquisa", name: "Pesquisando", color: "#8b5cf6" },
    { id: "contato", name: "1º contato feito", color: "#06b6d4" },
    { id: "followup", name: "Follow-up", color: "#f59e0b" },
    { id: "proposta", name: "Reunião / Proposta", color: "#ec4899" },
    { id: "fechado", name: "Fechado ✅", color: "#22c55e", kind: "won" },
    { id: "perdido", name: "Perdido", color: "#94a3b8", kind: "lost" },
  ],
  tags: [
    { id: "quente", name: "Quente", color: "#e5484d" },
    { id: "morno", name: "Morno", color: "#f0a83c" },
    { id: "frio", name: "Frio", color: "#4c9aff" },
    { id: "ads", name: "Anuncia no Google", color: "#22a45d" },
    { id: "semsite", name: "Sem site", color: "#a371f7" },
    { id: "igfraco", name: "Instagram fraco", color: "#e0559f" },
  ],
  script: ["Ver o anúncio", "Analisar o Instagram", "Analisar o site", "Mandar a 1ª mensagem", "Follow-up em 2 dias", "Follow-up em 7 dias"],
  message: "Olá, {nome}! Tudo bem? Vi o trabalho de vocês e tenho uma ideia para trazer mais clientes pelo Google e Instagram. Posso te mostrar em 5 minutos?",
};
const HIST_QUICK = ["Mandei mensagem", "Liguei", "Sem resposta", "Pediu orçamento", "Enviei proposta", "Marcou reunião"];

let cfg = clone(DEFAULT_CFG);
let leads = [];
let db = null, downloads = null, dbState = "loading";
const ui = load("ui", { view: "board", tags: [], due: "" });
ui.q = "";

// ================= utilidades =================
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function load(k, d) { try { const v = localStorage.getItem("nc:" + k); return v ? { ...d, ...JSON.parse(v) } : d; } catch { return d; } }
function save(k, v) { try { localStorage.setItem("nc:" + k, JSON.stringify(v)); } catch {} }
function uid() { return (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)).replace(/-/g, "").slice(0, 20); }
function $(s, r = document) { return r.querySelector(s); }

async function createLeads(drafts, o) {
  const tags = clone(cfg.tags); let cfgChanged = false;
  const tagByName = (n) => tags.find((t) => norm(t.name) === norm(n));
  const pool = leads.slice(); const todo = []; let skipped = 0;
  for (const d of drafts) { if (o.skipDup && dupOf(d, pool)) { skipped++; continue; } todo.push(d); pool.push(d); }
  for (const d of todo) for (const t of d.tagsIn || []) if (!tagByName(t.name)) { tags.push({ id: uid().slice(0, 8), name: t.name, color: t.color }); cfgChanged = true; }
  let stages = cfg.stages;
  if (o.newStages?.length) { stages = [...cfg.stages, ...o.newStages.map((n) => ({ id: uid().slice(0, 8), name: n, color: "#64748b" }))]; cfgChanged = true; }
  if (cfgChanged) { if (!(await write(() => db.doc("config/board").set({ ...cfg, tags, stages })))) return; cfg = { ...cfg, tags, stages }; }
  const orders = {}; const now = new Date().toISOString(); let created = 0;
  for (const d of todo) {
    const st = matchStage(d.status)?.id || o.stage;
    orders[st] = orders[st] ?? nextOrder(st); const order = orders[st]; orders[st] += 1000;

      city: d.city ?? null, niche: d.niche ?? null, source: d.source ?? o.source ?? null, value: d.value ?? null,
      next: d.next ?? null, notes: d.notes || "",
      checklist: d.checklist?.length ? d.checklist : o.script ? cfg.script.map((t) => ({ t, d: false })) : [],

}

function startDrag(e, id, el) {
  if (e.button !== 0 || e.target.closest("a,button")) return;
  const r = el.getBoundingClientRect();

  window.addEventListener("pointercancel", onCancel);

function onMove(e) {

  }
  e.preventDefault();
  drag.ghost.style.transform = `translate(${e.clientX - drag.dx}px, ${e.clientY - drag.dy}px) rotate(2deg)`;
  const board = $("#board");
  if (board) { const br = board.getBoundingClientRect(); if (e.clientX > br.right - 50) board.scrollLeft += 16; else if (e.clientX < br.left + 50) board.scrollLeft -= 16; }
  const under = document.elementFromPoint(e.clientX, e.clientY);
  const col = under && under.closest(".col");
  document.querySelectorAll(".col.drop").forEach((c) => c !== col && c.classList.remove("drop"));
  document.querySelectorAll(".slot").forEach((s) => s.remove());
  if (!col) { drag.target = null; return; }
  col.classList.add("drop");
  const list = col.querySelector(".cards");
  const lr = list.getBoundingClientRect();
  if (e.clientY > lr.bottom - 36) list.scrollTop += 10; else if (e.clientY < lr.top + 36) list.scrollTop -= 10;
  const els = [...list.querySelectorAll(".card")].filter((x) => x.dataset.id !== drag.id);
  let before = null;
  for (const c of els) { const r = c.getBoundingClientRect(); if (e.clientY < r.top + r.height / 2) { before = c; break; } }
  const slot = h("div", { class: "slot" });
  if (before) list.insertBefore(slot, before); else list.append(slot);
  drag.target = { stage: col.dataset.stage, beforeId: before ? before.dataset.id : null };
}

function onCancel() { endDrag(true); }

  d.ghost.remove(); d.el.classList.remove("src"); document.body.classList.remove("dragging");

}
function moveLead(id, stage, beforeId) {

  let i = beforeId ? list.findIndex((l) => l.id === beforeId) : list.length; if (i < 0) i = list.length;

    anotacoes: String(l.notes || "").slice(0, 15000),
  };
  const prompt = `Você ajuda uma gestora de anúncios no Google que atende exclusivamente escritórios de advocacia no Brasil a prospectar clientes.
Com base SOMENTE nos dados abaixo (não invente fatos que não estejam neles), escreva em português do Brasil:
1. "analysis": de 3 a 4 tópicos curtos, cada um começando com "• ", com as brechas concretas que mexem com o bolso do escritório ou com o Provimento 205 da OAB (promessa de resultado, uso de "especialista" sem título, divulgação de resultados), e o que o escritório já faz bem.

Dados:
${JSON.stringify(info, null, 1)}`;
  try {

}

}

// ================= o lead aberto =================
let openId = null, mEls = null;

      const cur = leads.find((x) => x.id === id) || l;

      if ((cur[key] ?? null) === v) return;

  notes.addEventListener("change", () => patch(id, { notes: notes.value }));

  histIn.addEventListener("keydown", (e) => { if (e.key === "Enter") { addHist(histIn.value); histIn.value = ""; } });
  const ckIn = h("input", { class: "input", placeholder: "Adicionar um passo (Enter)" });
  ckIn.addEventListener("keydown", (e) => { if (e.key === "Enter" && ckIn.value.trim()) { const cur = leads.find((x) => x.id === id); const checklist = [...(cur.checklist || []), { t: ckIn.value.trim(), d: false }]; cur.checklist = checklist; ckIn.value = ""; patch(id, { checklist }); drawDyn(); } });
  const msgBox = h("div", { class: "msg" });

  veil.append(h("div", { class: "modal", role: "dialog", "aria-label": l.name },
    h("div", { class: "m-top" }, stageSel, h("button", { class: "x", onclick: closeLead, title: "Fechar (Esc)" }, "✕")),

          fld("website", "Site", "empresa.com.br", (x) => x.website),
          fld("ad", "Anúncio", "link do anúncio", (x) => x.ad),
          fld("maps", "Perfil no Google (Maps)", "link do perfil no Google", (x) => x.maps),
          fld("city", "Cidade", "Campinas"),
          fld("niche", "Nicho", "Clínica, restaurante…"),

          fld("next", "📞 Próximo contato", ""))),
        h("div", { class: "sec" }, h("h4", {}, "Anotações"), notes),

      ),

        h("div", { class: "sec" }, h("h4", {}, "Histórico de contato"),
          h("div", { class: "quick", style: "margin-bottom:6px" }, HIST_QUICK.map((t) => h("button", { class: "btn sm", onclick: () => addHist(t) }, t))),
          histIn, h("div", { style: "height:8px" }), histBox),

  ));
  m.append(veil);

}
function drawDyn() {
  const l = leads.find((x) => x.id === openId); if (!l || !mEls) return;
  const { tagBox, ckBox, histBox, actBox, msgBox } = mEls;
  tagBox.replaceChildren(...cfg.tags.map((t) => h("button", { class: (l.tags || []).includes(t.id) ? "on" : "", style: "background:" + t.color, onclick: () => { const tags = (l.tags || []).includes(t.id) ? l.tags.filter((x) => x !== t.id) : [...(l.tags || []), t.id]; l.tags = tags; patch(l.id, { tags }); drawDyn(); render(); } }, t.name)));
  const ck = l.checklist || []; const done = ck.filter((x) => x.d).length; const pct = ck.length ? Math.round((done / ck.length) * 100) : 0;
  ckBox.replaceChildren(
    ck.length ? h("div", { class: "progress", title: pct + "%" }, h("span", { class: pct === 100 ? "full" : "", style: `width:${pct}%` })) : h("p", { class: "muted small" }, "Sem passos ainda."),
    ...ck.map((it, i) => h("label", { class: it.d ? "done" : "" },
      h("input", { type: "checkbox", checked: it.d, onchange: () => { const checklist = ck.map((x, j) => (j === i ? { ...x, d: !x.d } : x)); l.checklist = checklist; patch(l.id, { checklist }); drawDyn(); render(); } }),
      h("span", {}, it.t))),
    !ck.length && cfg.script.length ? h("button", { class: "btn sm", onclick: () => { const checklist = cfg.script.map((t) => ({ t, d: false })); l.checklist = checklist; patch(l.id, { checklist }); drawDyn(); } }, "＋ Usar o roteiro padrão") : null);
  histBox.replaceChildren(...[...(l.history || [])].reverse().map((x) => h("div", {}, h("time", {}, fmtWhen(x.at)), x.t)));
  const google = "https://www.google.com/search?q=" + encodeURIComponent([l.name, l.city].filter(Boolean).join(" "));
  const delBtn = h("button", { class: "btn ghost sm", onclick: () => delBtn.replaceWith(h("span", { class: "confirm" }, "Apaga o lead e o histórico.", h("button", { class: "btn danger sm", onclick: () => { closeLead(); write(() => leadRef(l.id).delete(), "Lead apagado"); } }, "Apagar de vez"))) }, "Excluir de vez…");
  actBox.replaceChildren(
    l.phone ? h("a", { class: "btn wa sm", href: waUrl(l.phone, msgFor(l)), target: "_blank", rel: "noreferrer" }, "💬 Chamar no WhatsApp") : null,
    h("a", { class: "btn sm", href: google, target: "_blank", rel: "noreferrer" }, "🔎 Ver no Google"),
    h("button", { class: "btn sm", onclick: () => setNext(l, 1, "Retorno marcado") }, "📞 Amanhã"),
    h("button", { class: "btn sm", onclick: () => setNext(l, 2, "Retorno marcado") }, "+2 dias"),
    h("button", { class: "btn sm", onclick: () => setNext(l, 7, "Retorno marcado") }, "+7 dias"),
    l.archived ? h("button", { class: "btn sm", onclick: () => { patch(l.id, { archived: false }); closeLead(); } }, "Desarquivar")
      : h("button", { class: "btn sm", onclick: () => { patch(l.id, { archived: true, history: [...(l.history || []), { at: new Date().toISOString(), t: "Arquivado" }] }); closeLead(); toast("Lead arquivado. Está em Arquivados."); } }, "🗄 Arquivar"),
    delBtn);
  const copy = h("button", { class: "btn sm", onclick: async () => { try { await navigator.clipboard.writeText(msgFor(l)); toast("Mensagem copiada"); } catch { const r = document.createRange(); r.selectNodeContents(txt); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Selecionei a mensagem: copie com Ctrl+C"); } } }, "Copiar");
  const txt = h("div", {}, msgFor(l));
  msgBox.replaceChildren(txt, h("div", { class: "quick", style: "margin-top:6px" }, copy, l.phone ? null : h("span", { class: "muted small" }, "Preencha o WhatsApp para abrir a conversa.")));
  const f = document.getElementById("f-next"); if (f && document.activeElement !== f) f.value = toLocalInput(l.next);
}
function refreshModal() { if (!openId) return; if (!leads.find((x) => x.id === openId)) { closeLead(); return; } drawDyn(); }
function closeLead() { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); openId = null; mEls = null; $("#modal").replaceChildren(); document.removeEventListener("keydown", escClose); }
function escClose(e) { if (e.key === "Escape") closeLead(); }

// ================= colar / importar =================
function openImport() {
  const m = $("#modal"); m.replaceChildren();
  let tab = "paste", fileLeads = [], trelloLists = [], busy = false;
  const veil = h("div", { class: "veil", onmousedown: (e) => e.target === veil && !busy && close() });
  const close = () => { m.replaceChildren(); document.removeEventListener("keydown", esc); };
  const esc = (e) => e.key === "Escape" && !busy && close();
  document.addEventListener("keydown", esc);
  const ta = h("textarea", { class: "input paste", rows: 9, id: "paste", placeholder: "Clínica Sorriso\nPatrocinado\nhttps://www.clinicasorriso.com.br\ninstagram.com/clinicasorriso\n(11) 98888-7777\nCidade: Campinas\n\nPizzaria do Zé\n@pizzariadoze\nwa.me/5511977776666" });
  const single = h("input", { type: "checkbox", id: "single" });
  const file = h("input", { type: "file", id: "file" });
  const stage = h("select", { class: "input", style: "max-width:320px", id: "imp-stage" }, cfg.stages.map((s) => h("option", { value: s.id }, s.name)));
  const opt = (id, label, on = true) => { const c = h("input", { type: "checkbox", id, checked: on }); return [c, h("label", { class: "opt", for: id }, c, label)]; };
  const [oScript, lScript] = opt("o-script", "Criar o roteiro de prospecção em cada lead");
  const [oTags, lTags] = opt("o-tags", "Etiquetar sozinho: “Anuncia no Google” e “Sem site”");
  const [oDup, lDup] = opt("o-dup", "Pular leads repetidos (mesmo Instagram ou site)");
  const [oStages, lStages] = opt("o-stages", "");
  const help = h("p", { class: "muted small" });
  const body = h("div", { style: "display:flex;flex-direction:column;gap:8px" });
  const preview = h("div");
  const err = h("p", { class: "small", style: "color:var(--crit)" });
  const go = h("button", { class: "btn primary" }, "Adicionar");
  const tabsEl = h("div", { class: "tabs", style: "align-self:flex-start" });
  const drafts = () => (tab === "paste" ? parseText(ta.value, single.checked) : fileLeads);
  const missing = () => (tab === "trello" ? trelloLists.filter((n) => !matchStage(n)) : []);
  function draw() {
    tabsEl.replaceChildren(...[["paste", "Colar"], ["csv", "Planilha (CSV)"], ["trello", "Trello"]].map(([k, l]) => h("button", { class: tab === k ? "on" : "", onclick: () => { tab = k; fileLeads = []; trelloLists = []; file.value = ""; err.textContent = ""; draw(); } }, l)));
    body.replaceChildren();
    if (tab === "paste") {
      help.replaceChildren("Cole o que você achou no Google: nome, texto do anúncio e os links do site, do Instagram, do WhatsApp e do Maps. Cada coisa vai para o campo certo. ", h("b", {}, "Vários leads de uma vez:"), " deixe uma linha em branco entre eles.");
      body.append(help, ta, h("label", { class: "opt", for: "single" }, single, "Tudo isso é um lead só"));
    } else if (tab === "csv") {
      file.accept = ".csv,text/csv,.tsv,.txt";
      help.replaceChildren("No Google Planilhas: Arquivo → Fazer download → CSV. No Excel: Salvar como → CSV. Reconheço colunas como Nome, Empresa, Telefone, WhatsApp, Instagram, Site, Anúncio, Cidade, Nicho, Status/Etapa, Observações e Próximo contato. As outras colunas viram anotação.");
      body.append(help, file);
    } else {
      file.accept = ".json,application/json";
      help.replaceChildren("No Trello, abra o quadro → Menu (⋯) → Imprimir, exportar e compartilhar → Exportar como JSON. Salve o arquivo e escolha aqui. Vêm junto as listas, descrições, datas, etiquetas e checklists.");
      body.append(help, file);
      const mi = missing();
      if (mi.length) { lStages.lastChild.textContent = "Criar as etapas que faltam aqui: " + mi.join(", "); body.append(lStages); }
    }
    drawPreview();
  }
  function drawPreview() {
    const d = drafts(); const dups = d.filter((x) => dupOf(x)).length; const n = oDup.checked ? d.length - dups : d.length;
    preview.replaceChildren();
    if (d.length) preview.append(h("div", { class: "preview" },
      h("p", { style: "margin:2px 4px 6px" }, h("b", {}, `${d.length} lead${d.length > 1 ? "s" : ""} encontrado${d.length > 1 ? "s" : ""}`), dups ? h("span", { class: "muted" }, ` · ${dups} já está${dups > 1 ? "ão" : ""} no quadro`) : null),
      h("table", {}, h("thead", {}, h("tr", {}, ["Nome", "Instagram", "Site", "WhatsApp", "Cidade / nicho", tab === "paste" ? null : "Etapa"].filter(Boolean).map((x) => h("th", {}, x)))),
        h("tbody", {}, d.slice(0, 60).map((x) => h("tr", { class: dupOf(x) ? "dup" : "" },
          h("td", {}, x.name, x.adDetected ? h("span", { class: "muted small" }, " · anúncio") : null), h("td", {}, igHandle(x.instagram)), h("td", {}, (x.website || "").replace(/^https?:\/\/(www\.)?/, "")),
          h("td", {}, x.phone || ""), h("td", {}, [x.city, x.niche].filter(Boolean).join(" · ")), tab === "paste" ? null : h("td", {}, matchStage(x.status)?.name || x.status || "—")))))));
    go.textContent = busy ? "Adicionando…" : `Adicionar ${n} lead${n === 1 ? "" : "s"}`;
    go.disabled = busy || !n;
  }
  ta.addEventListener("input", drawPreview); single.addEventListener("change", drawPreview); oDup.addEventListener("change", drawPreview);
  file.addEventListener("change", async () => {
    err.textContent = ""; fileLeads = []; trelloLists = [];
    const f = file.files[0]; if (!f) return draw();
    const text = await f.text();
    try {
      if (tab === "trello") { const r = trelloToLeads(JSON.parse(text)); fileLeads = r.leads; trelloLists = r.lists; }
      else { fileLeads = csvToLeads(parseCsv(text)); if (!fileLeads.length) err.textContent = "Não achei linhas. A primeira linha da planilha precisa ser o cabeçalho."; }
    } catch (e) { err.textContent = tab === "trello" ? (e.message || "JSON inválido.") : "Não consegui ler esse arquivo."; }
    draw();
  });
  go.addEventListener("click", async () => {
    const d = drafts(); if (!d.length) return;
    busy = true; drawPreview();
    const n = await createLeads(d, { stage: stage.value, script: oScript.checked, autoTags: oTags.checked, skipDup: oDup.checked, newStages: tab === "trello" && oStages.checked ? missing() : [] });
    busy = false;
    if (n) close(); else drawPreview();
  });
  veil.append(h("div", { class: "modal imp", role: "dialog", "aria-label": "Adicionar leads" },
    h("div", { class: "m-top" }, h("b", { style: "font:700 18px var(--display)" }, "Adicionar leads"), h("button", { class: "x", onclick: close }, "✕")),
    tabsEl, body, preview,
    h("label", { class: "field", for: "imp-stage" }, "Entrar na etapa (quando a planilha ou o Trello não disser qual)", stage),
    lScript, lTags, lDup, err,
    h("div", { class: "quick", style: "justify-content:flex-end" }, h("button", { class: "btn", onclick: close }, "Cancelar"), go)));
  m.append(veil); draw(); ta.focus();
}

// ================= planilha de saída =================
async function exportCsv() {
  if (!downloads) return;
  const rows = leads.filter((l) => !l.archived).sort((a, b) => cfg.stages.findIndex((s) => s.id === a.stage) - cfg.stages.findIndex((s) => s.id === b.stage) || (a.order || 0) - (b.order || 0)).map((l) => ({
    Nome: l.name, Etapa: stageOf(l.stage).name, "WhatsApp/Telefone": l.phone, Instagram: l.instagram, Site: l.website, Anúncio: l.ad, "Perfil no Google": l.maps, "Nota no Google": l.gRating, Contato: l.contact, "Melhor canal": l.channel,
    Cidade: l.city, Nicho: l.niche, Origem: l.source, "Valor estimado": l.value, "Próximo contato": l.next ? new Date(l.next).toLocaleString("pt-BR") : "",
    Etiquetas: (l.tags || []).map((id) => cfg.tags.find((t) => t.id === id)?.name).filter(Boolean).join(", "), Análise: l.analysis, "Mensagem personalizada": l.pitch, Anotações: l.notes,
    "Último contato": (l.history || []).slice(-1)[0]?.t || "", "Criado em": l.createdAt ? new Date(l.createdAt).toLocaleDateString("pt-BR") : "",
  }));
  if (!rows.length) { toast("Ainda não há leads para baixar."); return; }
  const heads = Object.keys(rows[0]);
  const esc = (v) => { const s = v == null ? "" : String(v); return /[";\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const csv = "﻿" + [heads.join(";"), ...rows.map((r) => heads.map((k) => esc(r[k])).join(";"))].join("\n");
  try { await downloads.save({ filename: "novos-clientes.csv", data: csv }); } catch (e) { if (e?.code !== "declined") toast("Não consegui gerar a planilha agora."); }
}
