<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,750&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: uma coluna de leitura, como uma folha de caderno pautado; barra de seções fixa no topo. */
:root {
  --bg: #F5F7FB;
  --paper: #FFFFFF;
  --ink: #18213A;
  --muted: #5B6683;
  --line: #DCE2EF;
  --accent: #2747C9;
  --accent-soft: #E6EBFB;
  --margin: #E7A3A3;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1322; --paper: #151C30; --ink: #E4E9F6; --muted: #98A3C2; --line: #2A3450;
  --accent: #8EA6FF; --accent-soft: #1F2A4D; --margin: #8A4B55; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0E1322; --paper: #151C30; --ink: #E4E9F6; --muted: #98A3C2; --line: #2A3450;
  --accent: #8EA6FF; --accent-soft: #1F2A4D; --margin: #8A4B55; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.wrap { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding-block: 10px; }
.brand { font-family: var(--display); font-weight: 750; font-size: 1.15rem; letter-spacing: -.01em; margin-right: auto; }
.brand span { color: var(--accent); }
nav.secoes { display: flex; gap: 6px; overflow-x: auto; max-width: 100%; scrollbar-width: none; }
nav.secoes a { flex: none; font-size: .82rem; font-weight: 600; color: var(--muted); text-decoration: none; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); }
nav.secoes a:hover, nav.secoes a:focus-visible { color: var(--accent); border-color: var(--accent); outline: none; }

.como { margin-top: 24px; background: var(--accent-soft); border-radius: 12px; padding: 16px 18px; display: grid; gap: 6px; }
.como b { font-family: var(--display); font-weight: 750; font-size: 1.02rem; }
.como p { margin: 0; color: var(--ink); }
.atualizado { margin: 10px 0 0; font-size: .85rem; color: var(--muted); }

article { margin-block: 20px 64px; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 8px 28px 32px 44px; position: relative; }
article::before { content: ""; position: absolute; top: 0; bottom: 0; left: 26px; width: 2px; background: var(--margin); opacity: .55; }
@media (max-width: 560px) { article { padding: 4px 16px 24px 28px; } article::before { left: 14px; } }
article h1 { font-family: var(--display); font-weight: 750; font-size: clamp(1.7rem, 5vw, 2.3rem); line-height: 1.15; letter-spacing: -.02em; margin: 24px 0 12px; text-wrap: balance; }
article h2 { font-family: var(--display); font-weight: 750; font-size: 1.55rem; line-height: 1.2; margin: 40px 0 12px; padding-top: 18px; border-top: 1px solid var(--line); text-wrap: balance; scroll-margin-top: 80px; }
article h3 { font-family: var(--display); font-weight: 600; font-size: 1.15rem; margin: 28px 0 8px; text-wrap: balance; scroll-margin-top: 80px; }
article p, article li { max-width: 68ch; }
article ul { padding-left: 1.2em; }
article li { margin: 4px 0; }
article a { color: var(--accent); }
article hr { display: none; }
article strong { font-weight: 600; }
article code { font-family: var(--mono); font-size: .85em; background: var(--accent-soft); padding: 1px 6px; border-radius: 5px; overflow-wrap: anywhere; }
article blockquote { margin: 12px 0; padding: 12px 16px; border-left: 3px solid var(--accent); background: var(--bg); border-radius: 0 10px 10px 0; color: var(--ink); }
article blockquote p { margin: 6px 0; }
.tw { overflow-x: auto; margin: 12px 0; border: 1px solid var(--line); border-radius: 10px; }
article table { border-collapse: collapse; width: 100%; font-size: .9rem; font-variant-numeric: tabular-nums; }
article th, article td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
article th { background: var(--bg); font-weight: 600; color: var(--muted); font-size: .8rem; letter-spacing: .02em; }
article tr:last-child td { border-bottom: 0; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">Freedom <span>· caderno</span></div>
  </div>
</header>

<div class="wrap">
  <section class="como">
    <b>Para mandar um desabafo novo</b>
    <p>Volte na conversa do Freedom no Claude e escreva o que você quer. O Claude anota aqui.</p>
  </section>
  <p class="atualizado">Atualizado em 11/11/2026</p>
  <article id="caderno"></article>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script type="text/markdown" id="fonte">
# Caderno de desabafos · Freedom

Aqui fica anotado tudo o que você quer que o Freedom faça.
Cada vez que você desabafar, entra uma anotação nova embaixo.

---

## Desabafo 1 · 11/11/2026 · Ferramenta de tarefas

**O que você disse:**
> Eu quero construir uma ferramenta de tarefas.

**O que eu entendi:**
Um lugar para organizar todo o trabalho da agência: o que precisa ser feito, para qual cliente, quem
vai fazer e até quando.

**Ideias para deixar mais inteligente:**
- A própria IA (o Freedom) também pode pegar tarefas para fazer.
- Quando um cliente novo fechar, as primeiras tarefas dele já podem nascer sozinhas.

**Integrações que talvez precise:**
- Google Drive, para ligar os arquivos às tarefas.

**Cuidado de segurança:**
- Nunca escrever senha de cliente dentro de uma tarefa.

**Perguntas para você (responda quando quiser):**
- Quem vai usar as tarefas: só você ou uma equipe também?
- Você já usa alguma ferramenta de tarefas hoje? Qual?

</script>
<script>
(function () {
  var md = document.getElementById("fonte").textContent;
  var alvo = document.getElementById("caderno");
  alvo.innerHTML = window.marked ? marked.parse(md) : "<pre>" + md.replace(/[&<]/g, function (c) { return c === "&" ? "&amp;" : "&lt;"; }) + "</pre>";
  // ids iguais aos do GitHub, para os links do índice funcionarem
  alvo.querySelectorAll("h1, h2, h3").forEach(function (h) {
    h.id = h.textContent.trim().toLowerCase().replace(/[^\p{L}\p{N}\s-]/gu, "").replace(/\s/g, "-");
  });
  alvo.querySelectorAll("table").forEach(function (t) {
    var w = document.createElement("div"); w.className = "tw";
    t.parentNode.insertBefore(w, t); w.appendChild(t);
  });
  document.addEventListener("click", function (e) {
    var a = e.target.closest('a[href^="#"]');
    if (!a) return;
    var el = document.getElementById(decodeURIComponent(a.getAttribute("href").slice(1)));
    if (el) { e.preventDefault(); el.scrollIntoView(); }
  });
})();
</script>
